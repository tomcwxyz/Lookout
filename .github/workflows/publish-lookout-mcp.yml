name: Publish Lookout MCP
on:
  push:
    tags:
      - "lookout-mcp-v*"
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm install --no-audit --no-fund
      - name: Check tag matches package version
        run: node -e "const p=require('./packages/lookout-mcp/package.json');if(process.env.GITHUB_REF_NAME!=='lookout-mcp-v'+p.version)process.exit(1)"
      - run: node --check packages/lookout-mcp/bin/lookout-mcp.mjs
      - run: node --test packages/lookout-mcp/test/launch.smoke.mjs
      - run: npm pack --workspace @goodship/lookout-mcp --dry-run
      - run: npm publish --workspace @goodship/lookout-mcp --access public
