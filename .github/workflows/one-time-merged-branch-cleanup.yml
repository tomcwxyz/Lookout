name: One-time cleanup of verified merged branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-verified-merged-refs:
    if: github.repository == 'tomcwxyz/Lookout' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged PR identity and delete only approved branch heads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const allowed=[[12,"feat/simple-agent-onboarding","a90835a7e8ff5ce468e4d9cfc46357bffe4d173e"],[11,"feat/agent-checkpoints-and-context-bridge","731e58c36d41405445e0d2396bfc651054cd1779"],[10,"feat/pr-context-handover","85c064628c6bba70b40eb0b8256ccfc3b4215009"],[9,"feat/work-handover-intelligence","14f0fdc1044aa6c15651ddff84d83593923bc262"],[8,"feat/manual-observation","593cc556d65d6fbf284fb5251d19376147b580f3"],[7,"feat/vercel-scheduled-observers","ae7396fbb70c67b87509a5ab7fd6b4ed7644704d"],[6,"fix/vercel-typescript-dependency","0fd0e1995bea46780bf22746751a9aa24d4e3c45"],[1,"feat/initial-project-intelligence","c1616886e242767d2dfe8d807488176feebcb3a2"]];
          const repo="tomcwxyz/Lookout";
          async function api(method, path) {
            const r=await fetch("https://api.github.com/repos/"+repo+path,{
              method,headers:{
                "Accept":"application/vnd.github+json",
                "Authorization":"Bearer "+process.env.GITHUB_TOKEN,
                "X-GitHub-Api-Version":"2022-11-28"
              }
            });
            if(method==="DELETE" && r.status===204) return null;
            if(!r.ok) throw new Error(method+" "+path+" -> "+r.status+" "+(await r.text()).slice(0,200));
            return r.json();
          }
          for(const [number,branch,expectedSha] of allowed){
            const pr=await api("GET","/pulls/"+number);
            if(!pr.merged_at || pr.head.ref!==branch || pr.head.sha!==expectedSha) {
              throw new Error("Merged PR metadata does not match approved branch: "+branch);
            }
            const ref=await api("GET","/git/ref/heads/"+branch);
            if(ref.ref!=="refs/heads/"+branch || ref.object.sha!==expectedSha) {
              throw new Error("Branch changed since approval; refusing deletion: "+branch);
            }
            if(branch==="main") throw new Error("Refusing to delete default branch");
            await api("DELETE","/git/refs/heads/"+branch);
            console.log("Deleted merged PR #"+number+" branch: "+branch);
          }
          
          NODE
