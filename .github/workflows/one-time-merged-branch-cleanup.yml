name: One-time cleanup of verified merged branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-verified-merged-refs:
    if: github.repository == 'tomcwxyz/Lookout' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged documentation branch after verifying its head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const repo="tomcwxyz/Lookout";
          const branch="chore/refresh-lookout-docs-and-cleanup", expectedSha="0685aad6ae5f0648a232aef64c4381885aae4a53", prNumber=13;
          async function api(method,path){
            const response=await fetch("https://api.github.com/repos/"+repo+path,{
              method,headers:{
                Accept:"application/vnd.github+json",
                Authorization:"Bearer "+process.env.GITHUB_TOKEN,
                "X-GitHub-Api-Version":"2022-11-28"
              }
            });
            if(method==="DELETE" && response.status===204) return null;
            if(!response.ok) throw new Error(method+" "+path+" "+response.status+" "+(await response.text()).slice(0,200));
            return response.json();
          }
          const pr=await api("GET","/pulls/"+prNumber);
          if(!pr.merged_at || pr.head.ref!==branch || pr.head.sha!==expectedSha) throw new Error("PR identity mismatch");
          const ref=await api("GET","/git/ref/heads/"+branch);
          if(ref.ref!=="refs/heads/"+branch || ref.object.sha!==expectedSha) throw new Error("Branch head changed: refusing deletion");
          await api("DELETE","/git/refs/heads/"+branch);
          console.log("Removed merged documentation branch: "+branch);
          
          NODE
