name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check packages/lookout-mcp/bin/lookout-mcp.mjs
      - run: node --check packages/lookout-mcp/bin/lookout-report.mjs
      - run: node --test packages/lookout-mcp/test/report.smoke.mjs
      - run: node --test packages/lookout-mcp/test/launch.smoke.mjs
      - run: npm pack --workspace @good-ship/lookout-mcp --dry-run
      - name: Verify clean npm tarball install
        run: |
          temp="$(mktemp -d)"
          npm pack --workspace @good-ship/lookout-mcp --pack-destination "$temp" >/dev/null
          tarball="$(find "$temp" -maxdepth 1 -name '*.tgz' -print -quit)"
          npm install --prefix "$temp/clean" --no-audit --no-fund "$tarball"
          LOOKOUT_MCP_BIN="$temp/clean/node_modules/@good-ship/lookout-mcp/bin/lookout-mcp.mjs" node --test packages/lookout-mcp/test/launch.smoke.mjs
      - name: Verify published npm release
        run: |
          version="$(npm view @good-ship/lookout-mcp@0.2.0 version)"
          test "$version" = "0.2.0"
          temp="$(mktemp -d)"
          npm install --prefix "$temp" --no-audit --no-fund @good-ship/lookout-mcp@0.2.0
          LOOKOUT_MCP_BIN="$temp/node_modules/@good-ship/lookout-mcp/bin/lookout-mcp.mjs" node --test packages/lookout-mcp/test/launch.smoke.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
